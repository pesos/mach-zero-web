<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7efe4" />
    <!-- Dark or light before the first paint (src/lib/theme.ts keeps it up to date). -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('portal.theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', t === 'dark');
        root.style.colorScheme = t;
        if (t === 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1b2f');
      })();
    </script>
    <!-- Personal links carry a secret in the path: never send it to other sites. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bagel+Fat+One&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <title>MachZero</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
